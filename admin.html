<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Panel · Canto DENI</title>
<style>
:root{--bg:#1b1030;--sf:#2a1b47;--tx:#f5efe6;--mu:#b9acd0;--ac:#ff4fa0;--ok:#7df0cf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:24px}
main{max-width:980px;margin:auto}h1{margin:0 0 16px}h2{margin:28px 0 10px;font-size:1.1rem}
.box{background:var(--sf);border-radius:14px;padding:18px;margin-bottom:14px}
input,button{font:inherit;border-radius:10px;border:2px solid #4a3a6e;background:var(--bg);color:var(--tx);padding:9px 12px}
button{cursor:pointer}.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.f{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mu);gap:4px}
.s{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #4a3a6e}
.t{font-weight:700;min-width:56px}.l{color:var(--ok)}.r{color:#ffb86b}a{color:var(--ok)}.mu{color:var(--mu)}
</style></head><body><main>
<h1>Panel Canto DENI</h1>
<div id="login" class="box"><div class="f"><label>Email<input id="em" type="email"></label><label>Contraseña<input id="pw" type="password"></label><button class="p" id="in">Entrar</button></div><p id="err" class="mu"></p></div>
<div id="app" hidden>
<div class="box"><b>Agregar disponibilidad</b> <span class="mu">(turnos de 10 min para el Meet)</span>
<div class="f" style="margin-top:10px"><label>Día<input type="date" id="d"></label><label>Desde<input type="time" id="a" value="16:00"></label><label>Hasta<input type="time" id="b" value="18:00"></label><button class="p" id="add">Crear turnos</button></div>
<p class="mu" id="am"></p></div>
<h2>Turnos</h2><div id="list"></div><button id="out" style="margin-top:20px">Salir</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),sb=supabase.createClient(CFG.URL,CFG.KEY);
const fd=f=>new Date(f+'T00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
async function init(){const {data}=await sb.auth.getSession();const ok=!!data.session;$('#login').hidden=ok;$('#app').hidden=!ok;if(ok)load()}
$('#in').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});$('#err').textContent=error?'Email o contraseña incorrectos.':'';init()};
$('#out').onclick=async()=>{await sb.auth.signOut();init()};
$('#add').onclick=async()=>{const d=$('#d').value,[h1,m1]=$('#a').value.split(':').map(Number),[h2,m2]=$('#b').value.split(':').map(Number);
  if(!d){$('#am').textContent='Elegí un día.';return}
  const rows=[];for(let m=h1*60+m1;m+10<=h2*60+m2;m+=10)rows.push({fecha:d,hora:`${String(m/60|0).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`});
  const {error}=await sb.from('slots').upsert(rows,{onConflict:'fecha,hora',ignoreDuplicates:true});
  $('#am').textContent=error?'Error: '+error.message:`Listo: ${rows.length} turnos para ${fd(d)}.`;load()};
async function load(){const {data}=await sb.from('slots').select().gte('fecha',new Date().toISOString().slice(0,10)).order('fecha').order('hora');
  const g={};(data||[]).forEach(s=>(g[s.fecha]??=[]).push(s));
  $('#list').innerHTML=Object.keys(g).length?'':'<p class="mu">Todavía no cargaste turnos.</p>';
  for(const [d,arr] of Object.entries(g)){const bx=document.createElement('div');bx.className='box';bx.innerHTML=`<b>${fd(d)}</b> <button data-del="${d}" style="float:right">Borrar día libre</button>`;
    arr.forEach(s=>{const h=s.hora.slice(0,5),st=document.createElement('div');st.className='s';
      const gc=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('Meet 10 min - '+s.nombre)}&dates=${d.replaceAll('-','')}T${h.replace(':','')}00/${d.replaceAll('-','')}T${String(+h.slice(0,2)+(+h.slice(3)+10>59?1:0)).padStart(2,'0')}${String((+h.slice(3)+10)%60).padStart(2,'0')}00&ctz=America/Argentina/Buenos_Aires`;
      st.innerHTML=`<span class="t">${h}</span>`+(s.libre?`<span class="l">Libre</span><button data-rm="${s.id}">Quitar</button>`:`<span class="r">Reservado: ${s.nombre}</span><a target="_blank" href="${gc}">Google Calendar</a><button data-fr="${s.id}">Liberar</button>`);
      bx.append(st)});$('#list').append(bx)}}
$('#list').onclick=async e=>{const t=e.target.dataset;
  if(t.rm)await sb.from('slots').delete().eq('id',t.rm);
  if(t.fr)await sb.from('slots').update({libre:true,nombre:null,telefono:null,perfil:null}).eq('id',t.fr);
  if(t.del)await sb.from('slots').delete().eq('fecha',t.del).eq('libre',true);load()};
init();
</script></main></body></html>
